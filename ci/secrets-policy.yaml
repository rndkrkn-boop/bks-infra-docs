# Secrets Management Policy
# Version: 1.0
# Last Updated: 2026-08-05
# Purpose: Define rules and best practices for handling secrets in the nemohermes_bks project
---

# ============================================================================
# 1. Environment Files (.env) Policy
# ============================================================================
env_files:
  description: "Rules for handling .env files in git repositories"
  
  rules:
    - rule_id: env-001
      name: ".env files must not be committed"
      severity: critical
      description: "Live .env files containing credentials must never be committed to git"
      actions:
        - ensure_gitignore_entry: ".env"
        - ensure_gitignore_entry: ".env.local"
        - ensure_gitignore_entry: ".env.*.local"
        - ensure_gitignore_entry: ".env.production"
      verification:
        - run_command: "git ls-files | grep -E '^\\.env' || echo 'No .env files in git'"
        - expected_result: "No matches (empty output)"
    
    - rule_id: env-002
      name: ".env.example must be maintained"
      severity: high
      description: "Provide .env.example with all required variables for onboarding developers"
      actions:
        - create_file: ".env.example"
        - document_all_variables: true
        - no_secrets_in_example: true
      content_example:
        - "# Database Configuration"
        - "DB_HOST=localhost"
        - "DB_PORT=5432"
        - "DB_NAME=mydb"
        - "DB_USER=postgres"
        - "DB_PASSWORD=<use secure method>"
        - ""
        - "# API Keys (obtain from config/vault)"
        - "API_KEY_GITHUB=xxx"
        - "API_KEY_STRIPE=xxx"
        - ""
        - "# Service Credentials"
        - "DOCKER_REGISTRY_PASSWORD=<obtain from CI/CD>"
      verification:
        - file_must_exist: ".env.example"
        - no_actual_secrets: true
    
    - rule_id: env-003
      name: ".env loading order"
      severity: high
      description: "Load .env files in correct order for dev/test/prod"
      order:
        - ".env.example (reference only)"
        - ".env (local, .gitignored, highest priority)"
        - ".env.local (project-local overrides, .gitignored)"
        - "environment variables (CI/CD, highest priority)"
      documentation: "Use dotenv-safe or similar library to enforce type safety"

# ============================================================================
# 2. API Keys in CI/CD Policy
# ============================================================================
ci_cd_secrets:
  description: "Rules for managing API keys and credentials in CI/CD pipelines"
  
  rules:
    - rule_id: cicd-001
      name: "Secrets must be stored in CI/CD environment only"
      severity: critical
      description: "Never hardcode API keys or credentials in workflow files, scripts, or config"
      actions:
        - use_github_secrets: true
        - use_gitlab_variables: true
        - use_docker_secrets: true
        - use_vault_integration: true
      verification:
        - search_files: "*.yml *.yaml *.sh *.py"
        - pattern_to_avoid: 
            - "password="
            - "api_key="
            - "secret="
            - "token="
            - "credential="
          case_insensitive: true
    
    - rule_id: cicd-002
      name: "GitHub Actions secrets configuration"
      severity: high
      description: "Configure repository secrets for all CI/CD integrations"
      secrets_required:
        - DOCKER_REGISTRY_PASSWORD
        - DOCKER_REGISTRY_USERNAME
        - GITHUB_TOKEN (auto-provisioned)
        - COSIGN_PASSWORD
        - COSIGN_KEY
        - VAULT_ADDR
        - VAULT_TOKEN
        - DATABASE_PASSWORD
        - API_KEY_STRIPE
        - API_KEY_GITHUB
      access_control:
        - secrets_not_in_logs: true
        - secrets_not_in_artifacts: true
        - mask_in_output: true
      usage_example: |
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      verification:
        - command: "gh secret list --repo <owner>/<repo>"
        - expected: "All required secrets present"
    
    - rule_id: cicd-003
      name: "Pull Request secret protection"
      severity: critical
      description: "Secrets must not be exposed in pull request runs from external contributors"
      actions:
        - use_pull_request_target: true
        - require_approval_for_secrets: true
        - prevent_fork_access_to_secrets: true
      documentation: |
        - Use 'pull_request_target' for jobs needing secrets
        - Require explicit approval for fork PRs
        - Never pass secrets to forks without review
    
    - rule_id: cicd-004
      name: "Secret rotation schedule"
      severity: high
      description: "Rotate API keys and credentials regularly"
      rotation_schedule:
        - DOCKER_REGISTRY_PASSWORD: "90 days"
        - COSIGN_KEY: "180 days"
        - VAULT_TOKEN: "30 days"
        - API_KEYS: "60-90 days"
        - DATABASE_PASSWORD: "180 days"
      tracking:
        - tool: "rotation-tracker.sh"
        - location: "ci/rotation-tracker.sh"
        - last_rotation_file: "ci/.last-rotation"

# ============================================================================
# 3. Database Passwords Policy
# ============================================================================
database_secrets:
  description: "Rules for managing database credentials and connection strings"
  
  rules:
    - rule_id: db-001
      name: "Database passwords must never be hardcoded"
      severity: critical
      description: "All database credentials must be injected via environment variables or secrets manager"
      actions:
        - never_in_source_code: true
        - never_in_config_files: true
        - use_environment_variables: true
        - use_secrets_vault: true
      verification:
        - search_files: "*.py *.js *.go *.sql *.yml *.yaml"
        - pattern_to_avoid:
            - "password.*=.*['\"]"
            - "pwd.*=.*['\"]"
            - "db_pass.*=.*['\"]"
          case_insensitive: true
    
    - rule_id: db-002
      name: "Database connection string format"
      severity: high
      description: "Use parameterized connection strings with environment variable substitution"
      correct_format:
        - "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
        - "mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
        - "mongodb://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
      incorrect_format_examples:
        - "postgresql://user:password123@localhost:5432/mydb"
        - "mysql://admin:AdminPass456@prod-db.example.com/db"
      implementation:
        tool: "python-dotenv or similar"
        example: |
          from dotenv import load_dotenv
          load_dotenv()
          db_password = os.getenv('DB_PASSWORD')
          connection = f"postgresql://{os.getenv('DB_USER')}:{db_password}@{os.getenv('DB_HOST')}/..."
    
    - rule_id: db-003
      name: "Database credential access control"
      severity: high
      description: "Limit database access credentials to authorized personnel and services"
      access_control:
        - prod_database_access: "limited to DevOps team + on-call"
        - staging_database_access: "all engineers + CI/CD"
        - dev_database_access: "local only, .gitignored"
        - backup_passwords: "encrypted, stored separately from primary secret"
      audit:
        - log_access_attempts: true
        - log_password_changes: true
        - retention_period: "90 days"
    
    - rule_id: db-004
      name: "Production database security"
      severity: critical
      description: "Production databases require additional security measures"
      requirements:
        - use_separate_credentials: true
        - use_read_only_replicas_for_analytics: true
        - use_different_password_for_each_env: true
        - require_ssl_connections: true
        - enable_password_expiry: true
        - use_vault_dynamic_credentials: true
      monitoring:
        - alert_failed_login_attempts: true
        - alert_privilege_escalation: true
        - track_query_changes: true
    
    - rule_id: db-005
      name: "Connection pooling with credentials"
      severity: medium
      description: "Use connection pooling to minimize credential exposure"
      implementation:
        - use_pgbouncer_for_postgres: true
        - use_mysql_pooling_proxy: true
        - credentials_in_pool_config_only: true
      example: |
        # pgbouncer.ini - credentials stored securely, not in app code
        [databases]
        mydb = host=pg.internal port=5432 user=$DB_USER password=$DB_PASSWORD

# ============================================================================
# 4. Secret Scanning and Detection
# ============================================================================
secret_scanning:
  description: "Tools and processes for detecting and preventing secret leaks"
  
  tools:
    - tool_id: scan-001
      name: "Pre-commit hooks"
      purpose: "Prevent commits containing secrets"
      implementation:
        - tool: "git-secrets or detect-secrets"
        - config_file: ".pre-commit-config.yaml"
        - patterns_to_detect:
            - AWS keys (AKIA...)
            - GitHub tokens (ghp_...)
            - Private keys (BEGIN PRIVATE KEY)
            - Database connection strings with passwords
            - API keys for major services
    
    - tool_id: scan-002
      name: "CI/CD pipeline scanning"
      purpose: "Scan all commits and PRs for secrets"
      implementation:
        - tool: "GitGuardian or GitHub secret scanning"
        - trigger: "on every push and PR"
        - action_on_detection: "block merge, alert team"
    
    - tool_id: scan-003
      name: "Regular repository audit"
      purpose: "Scan git history for accidentally committed secrets"
      implementation:
        - tool: "truffleHog or git-secrets"
        - frequency: "weekly"
        - command: "trufflehog git file:// --json > results.json"

# ============================================================================
# 5. Emergency Response (Compromised Secrets)
# ============================================================================
emergency_response:
  description: "Steps to take if a secret is accidentally exposed"
  
  incident_response:
    - step_1_immediate:
        - notify_security_team: "Within 15 minutes"
        - revoke_compromised_secret: "Immediately"
        - generate_new_secret: "In CI/CD system"
        - update_all_systems: "Using new secret"
    
    - step_2_investigation:
        - check_git_history: "Find where secret was committed"
        - check_logs: "Determine who has seen it"
        - check_caches: "Force cache invalidation"
        - audit_access_logs: "Look for unusual activity"
    
    - step_3_remediation:
        - force_push_history_rewrite: "Remove secret from git (use BFG Repo-Cleaner)"
        - notify_all_users: "Tell team to refresh caches"
        - monitor_api_usage: "Watch for misuse of exposed key"
        - document_incident: "Post-mortem and preventive measures"
    
    - step_4_prevention:
        - review_secret_management: "Improve processes"
        - enhance_scanning_tools: "Stricter detection"
        - training: "Educate team on secret handling"

# ============================================================================
# 6. Compliance and Auditing
# ============================================================================
compliance:
  description: "Compliance requirements and audit procedures"
  
  standards:
    - standard: "SOC 2 Type II"
      requirements:
        - no_hardcoded_secrets: true
        - secret_rotation_documented: true
        - access_control_enforced: true
        - audit_logs_retained: "90 days minimum"
    
    - standard: "OWASP Top 10"
      requirements:
        - prevent_sensitive_data_exposure: true
        - use_encryption_for_secrets_at_rest: true
        - use_encryption_for_secrets_in_transit: true
    
    - standard: "CIS Benchmarks"
      requirements:
        - enable_secret_scanning: true
        - restrict_access_to_secrets: true
        - rotate_credentials_regularly: true

  audit_procedures:
    - audit_frequency: "quarterly"
    - audit_scope:
        - secret_access_logs: true
        - secret_rotation_compliance: true
        - unauthorized_access_attempts: true
        - policy_violations: true
    - documentation_required: true
    - management_sign_off: true

