# ─────────────────────────────────────────────────────────────────────────────
# Каталог комплаенс-правил bks/infra.
#
# Источник истины для `scripts/compliance-audit.py`. Формат — TOML, потому что
# CI-джобы этого репо стартуют на голом python:3.11-slim без `pip install`
# (tomllib в stdlib с 3.11), а история bks уже знает, чем кончается
# непиннутая зависимость в CI (ruff 0.16.0, коммит c0eece8 в bks/memgraphrag).
#
# Правило — это данные. Чтобы внести регуляторное требование, Python править
# не нужно: каталог ревьюится отдельно от движка.
#
# Каждое правило обязано ссылаться на реальный артефакт репозитория. Правило,
# которое нельзя провалить, комплаенс не измеряет — оно его имитирует.
#
# Поля правила:
#   id          — стабильный идентификатор (отчёты, метрики, waiver-ы)
#   title       — человекочитаемая формулировка требования
#   framework   — на что опирается требование (152-ФЗ / GDPR / NFR / SLSA / GOV)
#   reference   — конкретная статья, пункт или документ
#   severity    — critical | high | medium | low
#   rationale   — зачем; попадает в Markdown-отчёт
#   remediation — что делать при FAIL
#   check       — таблица с типом проверки и её параметрами
#
# Типы проверок (реализованы в scripts/compliance-audit.py):
#   forbidden_pattern — regex не должен встречаться в tracked-файлах
#   required_pattern  — regex обязан встречаться в указанном файле
#   paths_tracked     — путь обязан быть под контролем версий
#   paths_not_tracked — glob не должен попасть под контроль версий
#   paths_ignored     — путь обязан быть в .gitignore
#   max_age_days      — свежайший файл по шаблону не старше N дней
# ─────────────────────────────────────────────────────────────────────────────

[meta]
version = "1.0.0"
owner = "bks/infra"
updated = "2026-08-04"

[gate]
# Пайплайн падает на нарушениях этой severity и выше. Ниже — репортится, но не
# блокирует: комплаенс-гейт, который блокирует всё, отключают целиком.
block_at = "high"

[scan]
# Общие исключения для сканирующих правил: каталог правил и сам движок
# содержат сигнатуры по определению, иначе сканер ловит сам себя.
exclude = [
  # Каталог правил содержит сами сигнатуры — иначе сканер ловит сам себя.
  "compliance/rules.toml",
  # Сгенерированные отчёты: находки в них уже замаскированы, повторный проход
  # по ним даёт только шум.
  "docs/compliance/reports/*",
]
# Каталог тестов сознательно НЕ исключён: тесты — классическое слепое место
# секрет-сканеров. Фикстуры в tests/ собирают токеноподобные строки из частей,
# чтобы в исходнике не было литерала, похожего на настоящий ключ.

# ── Секреты ──────────────────────────────────────────────────────────────────

[[rules]]
id = "SEC-001"
title = "Секретный материал не попадает под контроль версий"
framework = "NFR"
reference = "NFR-5 (docs/agents-v2/00-vision-and-requirements.md); 152-ФЗ ст.19 ч.2 п.4"
severity = "critical"
rationale = """
Канонический store секретов — защищённые GitLab CI/CD Variables. Литерал в git
не отзывается ротацией переменной и остаётся в истории коммитов навсегда.
"""
remediation = """
Убрать литерал, перевыпустить секрет, вынести значение в group CI Variables
или в OpenShell provider (openshell:resolve:env:...).
"""
[rules.check]
type = "forbidden_pattern"
# Telegram bot token, OpenAI-подобные ключи, GitLab PAT, приватные ключи, AWS.
pattern = '(?:[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|sk-[A-Za-z0-9]{24,}|glpat-[A-Za-z0-9_-]{20,}|-----BEGIN (?:RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})'
include = ["*"]

[[rules]]
id = "SEC-002"
title = "Runtime-репозитории с секретами изолированы от монорепо"
framework = "NFR"
reference = "NFR-5; ARCHITECTURE.md §1 (deploy/.env — gitignored)"
severity = "critical"
rationale = """
Каталоги компонентов — независимые репозитории со своими deploy/.env. Если
родительский репо начнёт их отслеживать, .env уедет в bks/infra мимо всех
проверок дочерних пайплайнов.
"""
remediation = "Вернуть путь в .gitignore родительского репозитория."
[rules.check]
type = "paths_ignored"
paths = [
  "bksamotsvety",
  "router",
  "MemGraphRAG",
  "host-infra",
  "monitoring",
  "matrix",
  "sandbox-templates",
]

[[rules]]
id = "SEC-003"
title = "Файлы окружения и ключевой материал не отслеживаются git"
framework = "NFR"
reference = "NFR-5; GDPR art.32(1)(b)"
severity = "critical"
rationale = """
.env, *.key, *.pem — носители секретов по определению. Шаблоны (.env.example)
допустимы и обязаны содержать только плейсхолдеры.
"""
remediation = "git rm --cached, добавить в .gitignore, перевыпустить секрет."
[rules.check]
type = "paths_not_tracked"
globs = ["*.env", ".env", "*.key", "*.pem", "*.p12", "*id_rsa*"]
allow = ["*.env.example", "*.env.template"]

# ── Персональные данные ──────────────────────────────────────────────────────

[[rules]]
id = "PII-001"
title = "Идентификаторы каналов и персональные данные не публикуются в репозитории"
framework = "152-ФЗ"
reference = "152-ФЗ ст.5 ч.4 (минимизация), ст.19; GDPR art.5(1)(c)"
severity = "high"
rationale = """
Telegram chat_id рабочих групп, телефоны и персональные адреса — данные, по
которым идентифицируется контур и его участники. Операционное правило проекта
прямо запрещает выносить chat_id в логи и отчёты; аудиторский документ в git —
такой же публикуемый артефакт.
"""
remediation = """
Заменить литерал плейсхолдером (<ops-group-chat-id>), сам идентификатор
держать в CI Variables и watchdog.env.
"""
[rules.check]
type = "forbidden_pattern"
# Telegram supergroup id и российские номера в двух записях.
pattern = '(?:-100[0-9]{10,}|\+7[0-9]{10}|8\(9[0-9]{2}\)[0-9]{7})'
include = ["*.md", "*.py", "*.sh", "*.yml", "*.yaml", "*.toml", "*.json"]

[[rules]]
id = "PII-002"
title = "PII-контур описан: отдельный namespace и очистка на выходе"
framework = "152-ФЗ"
reference = "NFR-6; 152-ФЗ ст.5 ч.2 (целевое использование); GDPR art.25"
severity = "high"
rationale = """
Разделение org-pii и общего графа — единственное, что мешает персональным
данным сотрудников растечься по профилям через retrieve. Требование должно
быть зафиксировано документально, иначе оно не переживёт смену исполнителя.
"""
remediation = "Восстановить описание PII-контура в спецификации домена."
[rules.check]
type = "required_pattern"
path = "docs/agents-v2/06-domain-equipment-and-org.md"
pattern = '(?s)org-pii.{0,4000}pii-cleaner'

# ── Разграничение доступа ────────────────────────────────────────────────────

[[rules]]
id = "AC-001"
title = "Доступ к графу памяти разграничен per-namespace"
framework = "NFR"
reference = "NFR-6; 152-ФЗ ст.19 ч.2 п.5 (перечень допущенных); ISO 27001 A.5.15"
severity = "high"
rationale = """
Профили имеют разный уровень доверия. Read/write ACL по namespace описывает,
кто и куда пишет; без этого контракта любая новая интеграция по умолчанию
получает доступ ко всему графу.
"""
remediation = "Вернуть описание namespace ACL в ARCHITECTURE.md."
[rules.check]
type = "required_pattern"
path = "ARCHITECTURE.md"
pattern = 'Namespace read/write ACL'

# ── Цепочка поставки ─────────────────────────────────────────────────────────

[[rules]]
id = "SUP-001"
title = "CI не использует плавающие теги образов"
framework = "SLSA"
reference = "SLSA v1.0 Build L2 (воспроизводимость сборки)"
severity = "high"
rationale = """
:latest делает пайплайн невоспроизводимым: тот же коммит завтра собирается
другим образом. Прецедент в bks уже был — непиннутый ruff 0.16.0 уронил lint
без единого изменения кода.
"""
remediation = "Заменить тег на версию или, лучше, на @sha256-digest."
[rules.check]
type = "forbidden_pattern"
pattern = '(?m)^[^\n#]*[\w./-]+:latest\s*$'
include = [".gitlab-ci.yml", "ci/*.yml", "ci/*.yaml", "Dockerfile", "*/Dockerfile", "*.Dockerfile", "*/Dockerfile.*"]

[[rules]]
id = "SUP-002"
title = "Зависимости, устанавливаемые в CI, запиннены"
framework = "SLSA"
reference = "SLSA v1.0 Build L2; инцидент c0eece8 (bks/memgraphrag)"
severity = "high"
rationale = """
pip install <pkg> без == тянет мажорную версию в день релиза прямо в
прод-пайплайн: без ревью и без возможности повторить вчерашний результат.
"""
remediation = "Указывать точную версию: pip install ruff==0.15.1."
[rules.check]
type = "forbidden_pattern"
pattern = '(?m)^\s*-?\s*(?:pip|pip3|uv pip)\s+install\s+(?!.*(?:==|-r |--requirement|-e ))[A-Za-z][\w.\[\]-]*'
include = [".gitlab-ci.yml", "ci/*.yml", "ci/*.yaml", "ci/*.sh", "scripts/*.sh", "Dockerfile", "*/Dockerfile"]

[[rules]]
id = "SUP-003"
title = "Логика подписи и проверки образов лежит в репозитории"
framework = "SLSA"
reference = "SLSA v1.0 Provenance; kanban architecture-improvements #2"
severity = "medium"
rationale = """
Общая cosign-обвязка — единственный способ гарантировать, что «проверено
локально» означает «проверено то, что уедет в CI». Пока файл не под контролем
версий, подпись прод-образов держится на локальной копии оператора.
"""
remediation = "Закоммитить ci/cosign-lib.sh вместе с CI-джобом подписи."
[rules.check]
type = "paths_tracked"
paths = ["ci/cosign-lib.sh"]

# ── Непрерывность и восстановление ───────────────────────────────────────────

[[rules]]
id = "BCP-001"
title = "Контракт полноты бэкапа задан численно и проверяем"
framework = "NFR"
reference = "NFR-4; ISO 27001 A.8.13; GDPR art.32(1)(c)"
severity = "high"
rationale = """
Свежесть архива не равна его полноте: аудит 2026-07-21 поймал бэкап, который
проходил проверку свежести при отсутствующих profiles и пяти kanban DB.
Playbook обязан фиксировать точное число артефактов и нулевое число ошибок.
"""
remediation = "Вернуть в DEPLOY.md раздел «Backup: контракт полноты»."
[rules.check]
type = "required_pattern"
path = "DEPLOY.md"
# Контракт с 2026-08-04 машиночитаемый: 8 обязательных артефактов перечислены в
# retention.toml, а признаком успеха служит status "complete" в manifest.json
# плюс пройденный restore-drill. Проверяем, что DEPLOY.md всё это фиксирует —
# не имитацию контракта, а именно те три условия.
pattern = '(?s)8 обязательных артефактов.{0,6000}status.{0,80}complete.{0,4000}restore-drill'

[[rules]]
id = "BCP-002"
title = "Аудиторские свидетельства не старше 90 дней"
framework = "NFR"
reference = "ISO 27001 A.5.35 (независимая проверка); внутренний регламент аудита"
severity = "medium"
rationale = """
Отчёт годичной давности описывает не текущую систему. Просроченный аудит — это
отсутствие аудита, только с бумагой.
"""
remediation = "Провести и опубликовать очередной аудит в docs/audit/."
[rules.check]
type = "max_age_days"
glob = "docs/audit/*.md"
max_age_days = 90

[[rules]]
id = "BCP-003"
title = "Бэкапы версионируются, а retention задан декларативно"
framework = "NFR"
reference = "NFR-4; ISO 27001 A.8.13; GDPR art.32(1)(c)"
severity = "high"
rationale = """
До 2026-08-04 имя артефакта содержало только дату, поэтому второй прогон за
сутки затирал первый: 2026-08-04 три запуска подряд перезаписали
memgraphrag-data-20260804.tar.gz, и вернуться к хорошей копии было некуда.
Версионирование и срок хранения обязаны существовать как конфигурация, а не как
предположение о поведении скрипта.
"""
remediation = "Вернуть backup/retention.toml с секцией [retention] и составом [[artifacts]]."
[rules.check]
type = "required_pattern"
path = "backup/retention.toml"
pattern = '(?s)\[retention\].{0,600}min_keep'

[[rules]]
id = "BCP-004"
title = "Движок проверки восстановления версионируется вместе с тестами"
framework = "NFR"
reference = "ISO 27001 A.8.13 (проверка восстанавливаемости); внутренний регламент аудита"
severity = "medium"
rationale = """
Ручной «ежеквартальный restore-тест» из README подтверждал набор 2026-07-09,
которого в хранилище давно нет. Проверка, зависящая от того, что человек про неё
вспомнит, в отчёте выглядит как проверка, но ею не является.
"""
remediation = "Вернуть scripts/backup-manager.py и tests/test_backup_manager.py под контроль версий."
# Юниты (bks-backup-drill.timer/.service) живут в host-infra — отдельном
# git-репозитории, заигноренном родителем, поэтому paths_tracked по ним измерял
# бы раскладку репозиториев, а не наличие проверки восстановления. Что drill
# запускается автоматически, требует BCP-001 через DEPLOY.md.
[rules.check]
type = "paths_tracked"
paths = [
  "scripts/backup-manager.py",
  "tests/test_backup_manager.py",
]

# ── Журналирование ───────────────────────────────────────────────────────────

[[rules]]
id = "LOG-001"
title = "Срок хранения журналов задан явно"
framework = "GDPR"
reference = "GDPR art.5(1)(e) (ограничение хранения); 152-ФЗ ст.5 ч.7"
severity = "medium"
rationale = """
Логи диалогов содержат пользовательский ввод. Бессрочное хранение — это
накопление персональных данных без срока и основания.
"""
remediation = "Зафиксировать retention в ARCHITECTURE.md и в конфигурации Loki."
[rules.check]
type = "required_pattern"
path = "ARCHITECTURE.md"
pattern = 'retention\s+\d+\s*[dдг]'

# ── Управление изменениями и правовой статус ─────────────────────────────────

[[rules]]
id = "GOV-001"
title = "Лицензия репозитория присутствует"
framework = "GOV"
reference = "Внутренний регламент публикации кода"
severity = "low"
rationale = "Без LICENSE правовой статус кода не определён ни для кого."
remediation = "Вернуть файл LICENSE в корень репозитория."
[rules.check]
type = "paths_tracked"
paths = ["LICENSE"]

[[rules]]
id = "GOV-002"
title = "Изменение прод-конфигурации агентов идёт только через git"
framework = "NFR"
reference = "NFR-9; ISO 27001 A.8.32 (управление изменениями)"
severity = "medium"
rationale = """
Ручная правка конфигурации в работающем sandbox не оставляет ни автора, ни
отката, ни возможности воспроизвести инцидент.
"""
remediation = "Вернуть NFR-9 в требования и sync-profiles.sh в процесс деплоя."
[rules.check]
type = "required_pattern"
path = "docs/agents-v2/00-vision-and-requirements.md"
pattern = '(?s)NFR-9.{0,400}sync-profiles\.sh'

# ── Реестр исключений ────────────────────────────────────────────────────────
# Waiver — осознанно принятый риск с владельцем и сроком, а не способ покрасить
# отчёт в зелёный. Просроченный waiver не применяется: правило снова блокирует
# пайплайн, а сам факт просрочки уходит в отчёт отдельной строкой.

[[waivers]]
rule = "SUP-001"
reason = """
minlag/mermaid-cli пиннится digest-ом отдельным изменением: у образа нет
стабильных версионных тегов в используемом реестре, а подмена тега вслепую
ломает mermaid-render — единственную проверку синтаксиса диаграмм.
"""
owner = "bks/infra"
ticket = "kanban architecture-improvements #7"
expires = "2026-10-01"

[[waivers]]
rule = "SUP-003"
reason = """
Карточка #2 (supply chain, cosign) в работе: обвязка написана и лежит в рабочем
дереве, коммит идёт вместе с CI-джобом подписи в рамках той карточки.
"""
owner = "bks/infra"
ticket = "kanban architecture-improvements #2"
expires = "2026-09-15"
