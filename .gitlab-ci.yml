stages:
  - docs
  - compliance
  - backup
  - metrics

# ── Рендер-валидация mermaid-диаграмм ─────────────────────────────────────
# Каждый блок из ARCHITECTURE_MERMAID.md реально рендерится mermaid-cli:
# «глазами» синтаксис уже пропускали (fix-коммит 8ed34df).
mermaid-render:
  stage: docs
  image:
    name: minlag/mermaid-cli:latest
    entrypoint: [""]
  rules:
    - changes:
        - ARCHITECTURE_MERMAID.md
        - .gitlab-ci.yml
  script:
    - mkdir -p /tmp/diagrams
    - awk '/^```mermaid$/{f=1;n++;next} /^```/{f=0} f{print > ("/tmp/diagrams/d" n ".mmd")}' ARCHITECTURE_MERMAID.md
    # Мы обнуляем entrypoint образа, поэтому воспроизводим его вручную:
    # mmdc не в PATH, а chrome НЕ запечён в образ (PUPPETEER_SKIP_DOWNLOAD) —
    # системный chromium прописан в родном /puppeteer-config.json
    # (executablePath + --no-sandbox). Свой конфиг не подсовывать!
    - export MMDC=/home/mermaidcli/node_modules/.bin/mmdc
    - |
      rc=0
      for f in /tmp/diagrams/*.mmd; do
        if "$MMDC" -p /puppeteer-config.json -i "$f" -o "${f%.mmd}.svg" >/dev/null 2>/tmp/err.log; then
          echo "OK   $f"
        else
          echo "FAIL $f"
          cat /tmp/err.log
          rc=1
        fi
      done
      exit $rc

# ── Анти-drift: текст и диаграммы не должны расходиться ──────────────────
# Ловит возврат «прошлых эпох» (K3s Running, старые порты/DNS) и репо,
# описанные только в одном из двух файлов. Детали — в самом скрипте.
docs-consistency:
  stage: docs
  image: python:3.11-slim
  rules:
    - changes:
        - ARCHITECTURE.md
        - ARCHITECTURE_MERMAID.md
        - scripts/check-docs-consistency.py
        - .gitlab-ci.yml
  script:
    - python scripts/check-docs-consistency.py

# ── Комплаенс-аудит: правила из compliance/rules.toml ─────────────────────
# Проверки детерминированные и zero-dep (tomllib в stdlib 3.11), поэтому
# джобу нужен только git — образ python:3.11-slim его не содержит.
#
# GIT_DEPTH: 0 обязателен: правило BCP-002 смотрит дату последнего коммита
# документов аудита, а при shallow clone (дефолт 20 коммитов) её у файла
# может просто не быть — проверка провалилась бы на пустом месте.
compliance-audit:
  stage: compliance
  image: python:3.11-slim
  variables:
    GIT_DEPTH: "0"
    COMPLIANCE_OUT_DIR: "$CI_PROJECT_DIR/.compliance-out"
  rules:
    # Регулярный прогон по расписанию: комплаенс должен ловить дрейф, а не
    # только правки, которые кто-то догадался связать с комплаенсом.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - compliance/**/*
        - scripts/compliance-*.py
        - ci/compliance-report.sh
        - tests/test_compliance_audit.py
        - .gitlab-ci.yml
        - .gitignore
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
  script:
    - bash ci/compliance-report.sh
  artifacts:
    when: always
    expire_in: 90 days
    expose_as: "Комплаенс-отчёт"
    paths:
      - .compliance-out/

# ── Тесты движка комплаенса ───────────────────────────────────────────────
# pytest пиннится намеренно: непиннутая зависимость в CI уже роняла lint в
# bks/memgraphrag (c0eece8), и правило SUP-002 запрещает это на уровне
# комплаенса — джоб обязан соблюдать собственные правила.
compliance-tests:
  stage: compliance
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - compliance/**/*
        - scripts/compliance-*.py
        - tests/test_compliance_audit.py
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
    - pip install --no-cache-dir pytest==9.0.2
    - git config --global user.email "ci@bks.invalid"
    - git config --global user.name "bks ci"
  script:
    - python -m pytest tests/test_compliance_audit.py -q

# ── Тесты движка версионированных бэкапов ─────────────────────────────────
# Движок ретеншена удаляет данные, поэтому его логика должна проверяться
# машиной, а не ревьюером: 34 теста покрывают полноту снапшота, GFS-слоты,
# детект повреждений (sha256 / PRAGMA integrity_check / обход tar) и отказ
# восстанавливать в production-пути.
#
# pytest пиннится намеренно (правило SUP-002): непиннутая зависимость в CI уже
# роняла lint в bks/memgraphrag (c0eece8).
backup-tests:
  stage: backup
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - scripts/backup-manager.py
        - backup/retention.toml
        - tests/test_backup_manager.py
        - .gitlab-ci.yml
  before_script:
    - pip install --no-cache-dir pytest==9.0.2
  script:
    - python -m pytest tests/test_backup_manager.py -q
    # Политика обязана разбираться и совпадать с движком: опечатка в
    # retention.toml иначе всплыла бы только ночью, в 03:00, на живом бэкапе.
    - python scripts/backup-manager.py --policy backup/retention.toml retention --root /tmp/empty-store


# ── Конвейер метрик: мост «артефакт по таймеру -> Prometheus» ─────────────
# Мост читает JSONL/JSON задач, которые нельзя скрейпить (процесса в момент
# скрейпа уже нет), и раскладывает textfile-экспозицию. Проверять его машиной
# обязательно: одна неэкранированная кавычка в значении лейбла поднимает
# node_textfile_scrape_error=1, и node-exporter перестаёт отдавать файл ЦЕЛИКОМ —
# гаснут все метрики источника сразу, молча и с виду «нормальным» дашбордом.
#
# pytest пиннится намеренно (правило SUP-002): непиннутая зависимость в CI уже
# роняла lint в bks/memgraphrag (c0eece8).
metrics-tests:
  stage: metrics
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - scripts/metrics-bridge.py
        - metrics/**/*
        - ci/metrics-bridge.sh
        - tests/test_metrics_bridge.py
        - .gitlab-ci.yml
  before_script:
    - pip install --no-cache-dir pytest==9.0.2
  script:
    - python -m pytest tests/test_metrics_bridge.py -q
    # Каталог источников обязан разбираться и совпадать с движком: опечатка в
    # sources.toml иначе всплыла бы через пять минут на хосте, пустой панелью.
    - python scripts/metrics-bridge.py --stdout --source watchdog || true
    - python -c "import tomllib, pathlib;
      cfg = tomllib.loads(pathlib.Path('metrics/sources.toml').read_text());
      names = [s['name'] for s in cfg['source']];
      print('источников в каталоге:', names);
      assert len(names) == len(set(names)), 'дубликаты имён источников'"

# ── Экспозиция проверяется родным promtool ────────────────────────────────
# python-тесты проверяют логику моста, но не соглашения формата: суффикс _total
# у gauge, единицы измерения (_days вместо _seconds), обязательный перевод строки
# в конце. Это ловит только promtool, и он уже нашёл две такие ошибки при
# разработке. Нужен docker, поэтому джоб на shell-раннере.
metrics-exposition-lint:
  stage: metrics
  tags: [gb10-shell]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - scripts/metrics-bridge.py
        - metrics/**/*
        - ci/metrics-bridge.sh
        - .gitlab-ci.yml
  script:
    # Версия образа берётся из monitoring/docker-compose.yml, если он рядом,
    # иначе фиксированная: валидатор не должен разъезжаться с прод-Prometheus.
    - PROM_IMAGE=prom/prometheus:v3.4.1
    - out=$(mktemp -d)
    # Синтетический источник: CI не имеет доступа к /home/admin/servers.
    # Во втором значении check намеренно есть кавычка: сломанное экранирование
    # поймает promtool ниже, а не пустая панель через месяц.
    - |
      cat > "$out/fixture.jsonl" <<JSONL
      {"ts_ms": 1785858371351, "check": "disk_space", "status": "ok", "detail": "disk 16%"}
      {"ts_ms": 1785858371411, "check": "gpu \" в кавычках", "status": "fail"}
      JSONL
    - |
      cat > "$out/sources.toml" <<TOML
      [defaults]
      out_dir = "$out"

      [[source]]
      name = "fixture"
      kind = "jsonl_last_by_key"
      path = "$out/fixture.jsonl"
      out = "bks_fixture.prom"
      metric_prefix = "bks_watchdog"
      timestamp_field = "ts_ms"
      timestamp_unit = "ms"
      TOML
    - python3 scripts/metrics-bridge.py --config "$out/sources.toml" --out-dir "$out"
    - |
      for f in "$out"/*.prom; do
        echo "--- $f"
        docker run --rm -i --entrypoint promtool "$PROM_IMAGE" check metrics < "$f"
      done
    - rm -rf "$out"

# ── Скрипты конвейера проходят shellcheck ─────────────────────────────────
metrics-shellcheck:
  stage: metrics
  # Тег пиннится намеренно: правило комплаенса SUP-001 запрещает плавающие теги
  # образов в CI, и джоб обязан соблюдать собственные правила репозитория.
  image: koalaman/shellcheck-alpine:v0.11.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - ci/metrics-bridge.sh
        - .gitlab-ci.yml
  script:
    - shellcheck ci/metrics-bridge.sh

# ── Юниты конвейера разбираются systemd ───────────────────────────────────
# Юниты ставятся руками (sudo), поэтому опечатка в них не всплывает до момента,
# когда кто-то будет разбираться, почему метрики не обновляются. systemd-analyze
# verify стоит дешевле этого разбирательства.
metrics-units-verify:
  stage: metrics
  tags: [gb10-shell]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - metrics/systemd/**/*
        - .gitlab-ci.yml
  script:
    # systemd-analyze verify возвращает 0 и при отсутствии части ссылок на чужие
    # юниты хоста, поэтому дополнительно ловим сообщения о собственных файлах.
    - |
      output=$(systemd-analyze verify metrics/systemd/* 2>&1 || true)
      echo "$output"
      if echo "$output" | grep -E 'bks-(metrics-bridge|compliance)\.(service|timer)'; then
        echo "systemd нашёл проблемы в юнитах конвейера" >&2
        exit 1
      fi
      echo "юниты разбираются без замечаний"
