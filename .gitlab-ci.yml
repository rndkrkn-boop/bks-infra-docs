stages:
  - docs
  - compliance

# ── Рендер-валидация mermaid-диаграмм ─────────────────────────────────────
# Каждый блок из ARCHITECTURE_MERMAID.md реально рендерится mermaid-cli:
# «глазами» синтаксис уже пропускали (fix-коммит 8ed34df).
mermaid-render:
  stage: docs
  image:
    name: minlag/mermaid-cli:latest
    entrypoint: [""]
  rules:
    - changes:
        - ARCHITECTURE_MERMAID.md
        - .gitlab-ci.yml
  script:
    - mkdir -p /tmp/diagrams
    - awk '/^```mermaid$/{f=1;n++;next} /^```/{f=0} f{print > ("/tmp/diagrams/d" n ".mmd")}' ARCHITECTURE_MERMAID.md
    # Мы обнуляем entrypoint образа, поэтому воспроизводим его вручную:
    # mmdc не в PATH, а chrome НЕ запечён в образ (PUPPETEER_SKIP_DOWNLOAD) —
    # системный chromium прописан в родном /puppeteer-config.json
    # (executablePath + --no-sandbox). Свой конфиг не подсовывать!
    - export MMDC=/home/mermaidcli/node_modules/.bin/mmdc
    - |
      rc=0
      for f in /tmp/diagrams/*.mmd; do
        if "$MMDC" -p /puppeteer-config.json -i "$f" -o "${f%.mmd}.svg" >/dev/null 2>/tmp/err.log; then
          echo "OK   $f"
        else
          echo "FAIL $f"
          cat /tmp/err.log
          rc=1
        fi
      done
      exit $rc

# ── Анти-drift: текст и диаграммы не должны расходиться ──────────────────
# Ловит возврат «прошлых эпох» (K3s Running, старые порты/DNS) и репо,
# описанные только в одном из двух файлов. Детали — в самом скрипте.
docs-consistency:
  stage: docs
  image: python:3.11-slim
  rules:
    - changes:
        - ARCHITECTURE.md
        - ARCHITECTURE_MERMAID.md
        - scripts/check-docs-consistency.py
        - .gitlab-ci.yml
  script:
    - python scripts/check-docs-consistency.py

# ── Комплаенс-аудит: правила из compliance/rules.toml ─────────────────────
# Проверки детерминированные и zero-dep (tomllib в stdlib 3.11), поэтому
# джобу нужен только git — образ python:3.11-slim его не содержит.
#
# GIT_DEPTH: 0 обязателен: правило BCP-002 смотрит дату последнего коммита
# документов аудита, а при shallow clone (дефолт 20 коммитов) её у файла
# может просто не быть — проверка провалилась бы на пустом месте.
compliance-audit:
  stage: compliance
  image: python:3.11-slim
  variables:
    GIT_DEPTH: "0"
    COMPLIANCE_OUT_DIR: "$CI_PROJECT_DIR/.compliance-out"
  rules:
    # Регулярный прогон по расписанию: комплаенс должен ловить дрейф, а не
    # только правки, которые кто-то догадался связать с комплаенсом.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - compliance/**/*
        - scripts/compliance-*.py
        - ci/compliance-report.sh
        - tests/test_compliance_audit.py
        - .gitlab-ci.yml
        - .gitignore
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
  script:
    - bash ci/compliance-report.sh
  artifacts:
    when: always
    expire_in: 90 days
    expose_as: "Комплаенс-отчёт"
    paths:
      - .compliance-out/

# ── Тесты движка комплаенса ───────────────────────────────────────────────
# pytest пиннится намеренно: непиннутая зависимость в CI уже роняла lint в
# bks/memgraphrag (c0eece8), и правило SUP-002 запрещает это на уровне
# комплаенса — джоб обязан соблюдать собственные правила.
compliance-tests:
  stage: compliance
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - compliance/**/*
        - scripts/compliance-*.py
        - tests/test_compliance_audit.py
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
    - pip install --no-cache-dir pytest==9.0.2
    - git config --global user.email "ci@bks.invalid"
    - git config --global user.name "bks ci"
  script:
    - python -m pytest tests/test_compliance_audit.py -q
