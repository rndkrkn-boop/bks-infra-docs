# ─────────────────────────────────────────────────────────────────────────────
# Политика версионирования и хранения бэкапов BKS.
#
# Источник истины для `scripts/backup-manager.py`. TOML по той же причине, что и
# compliance/rules.toml: CI-джобы этого репо стартуют на голом python:3.11-slim
# без `pip install` (tomllib в stdlib с 3.11), а непиннутая зависимость в CI уже
# роняла пайплайн bks/memgraphrag (коммит c0eece8).
#
# Политика — это данные. Изменить срок хранения или состав обязательных
# артефактов можно без правки Python: ревью политики отделено от ревью движка.
# ─────────────────────────────────────────────────────────────────────────────

[meta]
version = "1.0.0"
owner = "bks/infra"
updated = "2026-08-04"

# ── Раскладка ────────────────────────────────────────────────────────────────
[layout]
# Корень хранилища. Внутри — только snapshots/<snapshot_id>/ и симлинк latest.
root = "/home/admin/backups/bks"
snapshots_dir = "snapshots"
# snapshot_id — UTC-таймстемп YYYYMMDDTHHMMSSZ. Он сортируем лексикографически,
# монотонен и не зависит от локали, поэтому весь движок сортирует снапшоты
# строкой, а не парсингом дат.
#
# Дата в ИМЕНИ КАТАЛОГА, а не в имени файла — сознательное решение. В v1 дата
# была в имени файла (kanban-default-20260803.db), из-за чего два прогона в
# одни сутки затирали друг друга: 2026-08-04 три запуска подряд перезаписали
# memgraphrag-data-20260804.tar.gz, и откатиться к первому (хорошему) было
# некуда. Каталог-снапшот иммутабелен и атомарен как единица хранения.
id_format = "%Y%m%dT%H%M%SZ"

# ── Ретеншен: GFS (grandfather-father-son) ───────────────────────────────────
# Считаем «последние N бакетов», а не «моложе N дней». Разница принципиальна:
# при простое системы отсчёт от «сейчас» вычистил бы всё хранилище, а отсчёт по
# бакетам сохраняет N последних существующих. Так же работают restic и borg.
[retention]
daily = 7
weekly = 4
monthly = 6
yearly = 2

# Абсолютный минимум: столько новейших снапшотов не удаляются никогда, даже
# если политика их не удержала. Страховка от сноса хранилища при кривой правке
# политики (например, все счётчики выставлены в 0).
min_keep = 3

# Слот GFS может занять только снапшот со status = "complete". Иначе первый же
# битый прогон вытесняет из дневного слота хороший снапшот того же дня — ровно
# так v1 и терял данные при пересоздании sandbox'а.
gfs_requires_complete = true

# Неполные снапшоты не выбрасываются мгновенно: они нужны для разбора инцидента.
# Держим их отдельным коротким окном, уже по реальному возрасту.
incomplete_max_age_days = 3

# ── Ожидаемый состав снапшота ────────────────────────────────────────────────
# Полнота, а не свежесть. Аудит 2026-07-21 поймал бэкап, который проходил
# проверку свежести при отсутствующих profiles и пяти kanban DB; DEPLOY.md
# фиксирует контракт «8 обязательных непустых артефактов». Здесь этот контракт
# становится машиночитаемым: движок сам считает 8/8 и выставляет status.
#
# kind определяет способ проверки:
#   sqlite  — PRAGMA integrity_check + перечисление таблиц
#   tar.gz  — полный проход архива (ловит усечение, которое ls не видит)
#   opaque  — только размер и sha256

[[artifacts]]
name = "kanban-default.db"
kind = "sqlite"
required = true
min_bytes = 4096

[[artifacts]]
name = "kanban-production.db"
kind = "sqlite"
required = true
min_bytes = 4096

[[artifacts]]
name = "kanban-marketing.db"
kind = "sqlite"
required = true
min_bytes = 4096

[[artifacts]]
name = "kanban-research.db"
kind = "sqlite"
required = true
min_bytes = 4096

[[artifacts]]
name = "kanban-platform.db"
kind = "sqlite"
required = true
min_bytes = 4096

[[artifacts]]
name = "profiles.tar.gz"
kind = "tar.gz"
required = true
min_bytes = 1024

[[artifacts]]
name = "memgraphrag-data.tar.gz"
kind = "tar.gz"
required = true
min_bytes = 512

[[artifacts]]
name = "qdrant.tar.gz"
kind = "tar.gz"
required = true
# Qdrant снимается live-tar'ом без snapshot API (см. DEPLOY.md «Backup: контракт
# полноты»), поэтому наличие и обход архива — необходимый, но не достаточный
# признак консистентности. Целевой фикс — snapshot API; до него drill проверяет
# только распаковываемость.
min_bytes = 1024

[[artifacts]]
name = "matrix-synapse.tar.gz"
kind = "tar.gz"
required = true
min_bytes = 1024

[[artifacts]]
name = "matrix-postgres.sql.gz"
kind = "opaque"
required = true
# Логический дамп (pg_dump), не raw tar PGDATA: PGDATA внутри bind mount
# принадлежит postgres-пользователю образа, недоступен admin на хосте, и
# raw tar живой Postgres-директории без pg_start_backup()/pg_basebackup рискует
# дать невосстановимый снимок — хуже, чем недоказанная консистентность Qdrant
# выше. kind="opaque" — сознательно, не "tar.gz": .sql.gz это gzip текстового
# дампа, а не tar-архив; check_targz() вызывает tarfile.open(path, "r:gz") и
# упал бы на каждом прогоне с tarfile.TarError, хотя дамп абсолютно валиден.
# "opaque" проверяет то, что реально применимо — размер и sha256 (backup-
# manager.py verify_snapshot(), deep-check пропускается для kind не в
# {sqlite, tar.gz}).
min_bytes = 256

# ── Restore-drill ────────────────────────────────────────────────────────────
[drill]
# Каталоги, в которые drill не имеет права восстанавливать НИКОГДА. Регламент
# аудита прямо запрещает restore поверх production, а «случайно указал не тот
# --workdir» — самый дешёвый способ этот запрет нарушить. Проверка в коде.
forbidden_targets = [
  "/sandbox",
  "/home/admin/servers",
  "/home/admin/backups",
  "/etc",
]
# Drill обязан проходить не реже этого интервала, иначе status репортит STALE:
# «бэкап есть» и «из бэкапа восстанавливались» — разные утверждения.
max_age_days = 30
